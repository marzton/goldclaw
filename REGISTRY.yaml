# REGISTRY.yaml — Gold Shore Cortex Universal Resource Registry (seed)
#
# Machine-readable registry of systems, resources, and lineage.
# This is the GSC-0001 seed: hand-authored, not yet served by any Cortex
# service (none exists — see CANON.md "Cortex status"). Future tooling
# (gs-ledger / Resource Registry, per LEXICON.md and the bootstrap doctrine)
# should read and extend this shape rather than reinvent it.
#
# Field meanings, per resource entry:
#   stable_id    - durable ID, does not change when human_name changes
#   human_name   - current display name
#   class        - organization | platform | product | service | executor |
#                  workflow | protocol | skill | agent | artifact | project |
#                  experiment | repository | domain | runtime | database |
#                  queue | bucket | worker | provider | identity |
#                  historical-venture | legacy-venture | concept
#   status       - ACTIVE | TRANSITIONING | INCUBATING | EXPERIMENTAL |
#                  DORMANT | LEGACY | SUPERSEDED | ARCHIVED | HISTORICAL |
#                  RESERVED
#   canonical_repo / canonical_path - where the thing lives, if applicable
#   domains      - associated domain names
#   parent / successor / predecessor / influences - lineage
#   runtime_owner - who/what currently owns operating it
#   providers    - external providers this resource depends on
#   verification - verified | unknown | verify
#   notes        - free text, including what still needs checking

